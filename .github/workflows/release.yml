name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build and verify
        run: npm run check

      - name: Version packages on main
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            npm run version
          fi
          if [ -n "$(git status --porcelain -- package.json package-lock.json CHANGELOG.md .changeset)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json CHANGELOG.md .changeset
            git commit -m "Version packages [skip ci]"
            git push
          fi

      - name: Publish to npm
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view seo-lint-next version 2>/dev/null || true)
          if [ "$PACKAGE_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "seo-lint-next@$PACKAGE_VERSION is already published"
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true
