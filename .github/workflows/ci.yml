name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }} / ESLint ${{ matrix.eslint }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.18.0, 20.x, 22.x]
        eslint: [9.x]
        include:
          - node: 20.x
            eslint: 8.57.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install ESLint compatibility target
        if: matrix.eslint != '9.x'
        run: npm install --no-save eslint@${{ matrix.eslint }}

      - name: Check
        run: npm run check

      - name: Pack smoke test
        run: npm pack --dry-run
